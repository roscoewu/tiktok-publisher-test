<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Authorization result - Video Publisher Test</title>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222}code{display:block;word-break:break-all;background:#f3f3f3;padding:10px;border-radius:6px}</style></head><body>
<h1>Authorization result</h1>
<div id="out">Reading result...</div>
<p style="color:#666;font-size:13px">The code is single-use and expires in a few minutes. Paste it into your local test script right away.</p>
<script>
const p = new URLSearchParams(location.search), out = document.getElementById('out');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
if (p.get('error')) out.innerHTML = '<p>Authorization failed: ' + esc(p.get('error')) + ' ' + esc(p.get('error_description')||'') + '</p>';
else if (p.get('code')) out.innerHTML = '<p>Authorization code:</p><code>' + esc(p.get('code')) + '</code><p>state: ' + esc(p.get('state')||'') + '</p>';
else out.textContent = 'No authorization code in the URL.';
</script>
</body></html>
